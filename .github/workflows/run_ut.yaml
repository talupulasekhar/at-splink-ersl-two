name: Python Unit Tests

# Trigger this workflow only on pull request events targeted at specific branches
on:
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Test across multiple Python versions
        python-version: ["3.14"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          # Automatically use the version matrix and enable caching
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Dependencies
        # Synchronizes environment with your uv.lock file
        run: uv sync --frozen --all-extras --dev

      - name: Run Tests
        # Executes pytest inside the isolated uv environment
        run: uv run pytest packages/commons/test

